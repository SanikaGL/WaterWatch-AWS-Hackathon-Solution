    <circle cx="170" cy="190" r="16"/><rect x="158" y="206" width="24" height="46" rx="8"/>
    <circle cx="300" cy="180" r="16"/><rect x="288" y="196" width="24" height="52" rx="8"/>
    <circle cx="430" cy="192" r="16"/><rect x="418" y="208" width="24" height="46" rx="8"/>
  </g>
  <!-- collected bags -->
  <circle cx="235" cy="250" r="12" fill="#1c5366"/>
  <circle cx="370" cy="252" r="14" fill="#1c5366"/>
  <text x="300" y="320" fill="#dff1f8" font-family="sans-serif" font-size="22" font-weight="800" text-anchor="middle" opacity="0.9">Volunteers in action</text>
</svg>
