<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb3a3"/>
      <stop offset="0.6" stop-color="#17788f"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#c)"/>
  <!-- lake bank -->
  <path d="M0 250 Q300 225 600 250 V360 H0 Z" fill="#0a3f52" opacity="0.75"/>
