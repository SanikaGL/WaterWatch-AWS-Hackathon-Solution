AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  WaterWatch - citizen water-safety platform. Cost-optimized serverless stack:
  HTTP API + Lambda + DynamoDB (on-demand) + S3 + Cognito + EventBridge + SNS + SSM.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ReportThreshold:
    Type: Number
    Default: 5
    Description: Reports within the window that trigger a recurring issue.
  TimeWindowDays:
    Type: Number
    Default: 30
  RewardAmount:
    Type: Number
    Default: 500
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
  BedrockEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]      # Graviton: cheaper per-ms than x86
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        MEDIA_BUCKET: !Ref MediaBucket
        REPORT_THRESHOLD: !Ref ReportThreshold
        TIME_WINDOW_DAYS: !Ref TimeWindowDays
        REWARD_AMOUNT: !Ref RewardAmount
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_ENABLED: !Ref BedrockEnabled
        IG_PARAM_PREFIX: !Sub "/waterwatch/${Stage}"

Resources:
  # ---------------- DynamoDB (single table, on-demand) ----------------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "waterwatch-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # ---------------- S3 media bucket (public-read for IG + display) ----------------
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "waterwatch-media-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadForDisplayAndInstagram
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"

  # ---------------- Frontend SPA hosting (S3 private + CloudFront OAC) ----------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "waterwatch-site-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "waterwatch-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100          # cheapest edge footprint
        Origins:
          - Id: SiteS3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:          # SPA client-side routing fallback
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ---------------- Cognito (real auth) ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "waterwatch-${Stage}"
      AutoVerifiedAttributes: [email]        # email verification required
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmFn.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "waterwatch-web-${Stage}"
      GenerateSecret: false                   # public SPA client (SRP, no secret)
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  VolunteerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: volunteer
      UserPoolId: !Ref UserPool
  CleanerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: cleaner
      UserPoolId: !Ref UserPool
  AuthorityGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: authority
      UserPoolId: !Ref UserPool

  # Post-confirmation trigger: assign the self-selected group (volunteer|cleaner only).
  # 'authority' is NEVER self-assignable here (admin-assigned out of band).
  PostConfirmFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node22
        Bundle: true
        Minify: false
        OutExtension: [".js=.cjs"]
        EntryPoints: [src/cognitoPostConfirm.ts]
    Properties:
      Handler: cognitoPostConfirm.handler
      CodeUri: backend/
      Policies:
        # Use a wildcard pool ARN (not !GetAtt UserPool.Arn) to avoid a circular
        # dependency: UserPool -> PostConfirmFn (trigger) -> UserPool (policy).
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  PostConfirmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmFn
      Principal: cognito-idp.amazonaws.com
      # SourceArn omitted on purpose: referencing UserPool.Arn here recreates the
      # circular dependency. Cognito still invokes via the pool's LambdaConfig.
      SourceAccount: !Ref AWS::AccountId

  # ---------------- HTTP API (cheaper than REST) ----------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        # Default = no auth (public routes). Protected routes opt in per-method
        # in the handler via the JWT claims the authorizer injects when present.

  # ---------------- Main API Lambda ----------------
  ApiFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        # CommonJS output avoids the ESM "Dynamic require of node:https" error from
        # the bundled AWS SDK v3.
        Format: cjs
        Target: node22
        Bundle: true
        Minify: false
        OutExtension: [".js=.cjs"]
        EntryPoints: [src/lambda.ts]
    Properties:
      Handler: lambda.handler
      CodeUri: backend/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Sub "waterwatch-media-${Stage}-${AWS::AccountId}" }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParametersByPath]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/waterwatch/${Stage}/*"
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: "*"
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Ref AlertsTopic
      Environment:
        Variables:
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          BEDROCK_ENABLED: "true"
          STAGE_NAME: !Ref Stage
      Events:
        ProxyAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  # ---------------- Monthly pollution awareness alerts (EventBridge schedule) ----------------
  MonthlyAlertsFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node22
        Bundle: true
        Minify: false
        OutExtension: [".js=.cjs"]
        EntryPoints: [src/lambda.ts]
    Properties:
      Handler: lambda.scheduledMonthly
      CodeUri: backend/
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Environment:
        Variables:
          BEDROCK_ENABLED: "true"
      Events:
        Monthly:
          Type: Schedule
          Properties:
            # 06:00 UTC on the 1st of every month.
            Schedule: cron(0 6 1 * ? *)
            Name: !Sub "waterwatch-monthly-alerts-${Stage}"
            Description: Generate monthly highest-pollution awareness alerts per region.

  # ---------------- EventBridge (recurring-issue evaluation decoupling) ----------------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "waterwatch-${Stage}"

  # ---------------- SNS (flood / authority alerts) ----------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "waterwatch-alerts-${Stage}"

  # ---------------- SSM config params (non-secret defaults) ----------------
  RewardAmountParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/waterwatch/${Stage}/reward-amount"
      Type: String
      Value: !Ref RewardAmount
  ReportThresholdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/waterwatch/${Stage}/report-threshold"
      Type: String
      Value: !Ref ReportThreshold

Outputs:
  SiteUrl:
    Description: Public demo URL (CloudFront). This is the URL to submit.
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Description: S3 bucket to sync the built frontend into (aws s3 sync dist/).
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution id (for cache invalidation after deploy).
    Value: !Ref SiteDistribution
  ApiUrl:
    Description: Public HTTP API base URL (set as VITE_API_URL in the frontend build).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaPublicBase:
    Description: Public base URL for media (set as VITE_MEDIA_BASE).
    Value: !Sub "https://${MediaBucket}.s3.${AWS::Region}.amazonaws.com"
  Region:
    Value: !Ref AWS::Region
